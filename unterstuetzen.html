<!-- ========================================
     UNTERSTÜTZEN SIE UNS - HAUPTBEREICH
======================================== -->
 
<div class="support-page">
 
 
  <!-- ========================================
       HAUPTBEREICH 
  ======================================== -->
<section class="support-main-section">
 
    <!-- FORMULAR -->
<div class="support-form-box">
<h2>Mitglied werden</h2>
<p>Werden Sie Teil von ReCoral und helfen Sie mit, Korallenriffe zu schützen.</p>
 
      <form class="member-form">
<label for="name">Name</label>
<input type="text" id="name" name="name" placeholder="Ihr Name">
 
        <label for="email">E-Mail</label>
<input type="email" id="email" name="email" placeholder="Ihre E-Mail">
 
        <label for="reason">Warum möchten Sie uns unterstützen?</label>
<textarea id="reason" name="reason" rows="5" placeholder="Ihre Nachricht"></textarea>
 
        <button type="submit">Jetzt Mitglied werden</button>
</form>
</div>
 
    <!-- BILD -->
<div class="support-image-box">
<img src="images/support-reef.jpg" alt="Taucher bei Korallenriff">
</div>
 
    <!-- Box 2 -->
<div class="support-text-box">
<h2>Jetzt spenden</h2>
<p>Der Wiederaufbau unserer Ozeane beginnt mit eurer Hilfe!</p>
 
      <form class="member-form">
<label for="name">Name</label>
<input type="text" id="name" name="name" placeholder="Ihr Name">
 
        <label for="email">E-Mail</label>
<input type="email" id="email" name="email" placeholder="Ihre E-Mail">
 
        <label for="reason">Warum möchten Sie uns unterstützen?</label>
<textarea id="reason" name="reason" rows="5" placeholder="Ihre Nachricht"></textarea>
 
        <button type="submit">Jetzt als Spender/in registrieren</button>
</form>
</div>
 
  </section>
 
  <!-- ========================================
       KURZER ABSCHLUSS UNTEN
  ======================================== -->
<section class="support-bottom-note">
<p>
      Danke für Ihre Unterstützung – zusammen geben wir den Korallenriffen Hoffnung.
</p>
</section>
 
</div>


</body>
</html>
